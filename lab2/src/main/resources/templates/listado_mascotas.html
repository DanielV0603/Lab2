<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2>Lista de Mascotas</h2>
    <a th:href="@{/employee/new}" class="btn btn-primary mb-3 mt-2">Nueva mascota</a>
    <div class="mb-3">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar">
    </div>

    <table class="table table-bordered table-striped" id="tablaEmpleados">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Raza</th>
            <th>Edad</th>
            <th>Nombre del dueño</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mas : ${mascota}">
            <td th:text="${mas.nombre}"></td>
            <td th:text="${mas.especie}"></td>
            <td th:text="${mas.raza}"></td>
            <td th:text="${mas.edad}"> </td>
            <td th:text="${mas.nombreDueno}"></td>
            <td th:text="${mas.telefono}"></td>
            <td th:text="${mas.estado}"></td>
            <td></td>
            <td>
                <a
                   class="text-primary text-decoration-none">Editar</a>
            </td>
            <td>
                <a
                   class="text-danger text-decoration-none"
                   onclick="return confirm('¿Estás seguro de que deseas borrar este empleado?');">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
